apply plugin: 'com.android.application'

// امضای release: اطلاعاتش هیچ‌وقت داخل ریپو ذخیره نمی‌شود — فایل release-keystore.properties
// فقط توسط CI (ورک‌فلوی build-android.yml) از GitHub Secrets ساخته می‌شود و در .gitignore است.
// اگر این فایل نباشد (مثلاً روی سیستم شخصی بدون این secretها)، بیلد release بدون امضا انجام
// می‌شود — یعنی برای کار روزانه‌ی توسعه هیچ مشکلی پیش نمی‌آید، فقط برای انتشار در بازار/گوگل‌پلی
// حتماً باید از CI با این secretها بیاید.
def releaseKeystorePropsFile = rootProject.file('release-keystore.properties')
def releaseKeystoreProps = new Properties()
if (releaseKeystorePropsFile.exists()) {
    releaseKeystoreProps.load(new FileInputStream(releaseKeystorePropsFile))
}
def envVersionCode = System.getenv("ANDROID_VERSION_CODE")

android {
    namespace = "ir.novinproduct.samattech"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "ir.novinproduct.samattech"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // قبلاً همیشه ثابت روی 1/"1.0" بود — چون این نسخه (برخلاف نسخه‌ی داخلی خودمان که آپدیتش
        // را با manifest جدا در novinproduct.ir/updates/ کنترل می‌کنیم) قرار است در بازار/گوگل‌پلی
        // منتشر شود، و آن‌ها هر آپلود جدید را با یک versionCode بزرگ‌تر از قبلی می‌خواهند.
        versionCode envVersionCode ? envVersionCode.toInteger() : 1
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // برای LoginApprovalActionReceiver: پاسخ دکمه‌ی نوتیفیکیشن باید بدون هیچ WebView/نشست
        // Supabase Auth‌ای مستقیماً به push-login-respond برسد. همان env varhayی که مرحله‌ی
        // «Create .env file» در ورک‌فلوی build-android.yml برای Vite می‌سازد، اینجا هم (چون آن
        // ورک‌فلو آن‌ها را به‌عنوان متغیر محیطیِ کل جاب هم export می‌کند، نه فقط داخل .env)
        // در دسترس Gradle هستند. اگر خالی باشند (مثلاً بیلد محلی بدون این secretها)، رشته‌ی خالی
        // می‌ماند و LoginApprovalActionReceiver با یک لاگ خارج می‌شود، نه کرش.
        buildConfigField "String", "SUPABASE_URL", "\"${System.getenv('VITE_SUPABASE_URL') ?: ''}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${System.getenv('VITE_SUPABASE_ANON_KEY') ?: ''}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystorePropsFile.exists()) {
                storeFile rootProject.file(releaseKeystoreProps['storeFile'])
                storePassword releaseKeystoreProps['storePassword']
                keyAlias releaseKeystoreProps['keyAlias']
                keyPassword releaseKeystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // PushLoginMessagingService.java (این ماژول app) از com.capacitorjs.plugins.pushnotifications.MessagingService
    // ارث‌بری می‌کند که خودش از com.google.firebase.messaging.FirebaseMessagingService ارث‌بری می‌کند. پلاگین
    // push-notifications این وابستگی را با implementation (نه api) اعلام کرده، یعنی در زمان اجرا داخل APK نهایی
    // هست، اما در classpath کامپایل همین ماژول app در دسترس نیست — دقیقاً همین چیزی که باعث خطاهای
    // «cannot access FirebaseMessagingService» / «PushLoginMessagingService cannot be converted to Context» در
    // build-android.yml می‌شد (از وقتی این فایل در 18 شهریور اضافه شد، هیچ بیلد اندرویدی موفق نشده بود). با
    // اعلام مستقیم همین وابستگی اینجا هم، کلاس برای کامپایل کد جاوای این ماژول در دسترس قرار می‌گیرد.
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
