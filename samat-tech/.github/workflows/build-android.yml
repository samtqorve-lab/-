name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          # LoginApprovalActionReceiver (دکمه‌های واقعی «تایید»/«رد» روی نوتیفیکیشن) این دو مقدار
          # را از BuildConfig می‌خواند، که در Gradle با System.getenv() ساخته می‌شود — نوشتن در
          # .env فقط برای مرحله‌ی Vite کافی است، Gradle باید همین‌ها را به‌صورت متغیر محیطیِ
          # واقعیِ جاب هم ببیند، پس با GITHUB_ENV هم export می‌کنیم.
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Build web assets and sync Capacitor
        run: npm run cap:sync

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: samat-tech-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
