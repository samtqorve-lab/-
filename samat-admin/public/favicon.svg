  <path d="M8 46 L18 46 L20 42.5 L11 42.5 Z" fill="url(#terraceDark)" opacity="0.55"/>
  <path d="M21 40 L27 40 L28.5 37 L23 37 Z" fill="url(#terraceDark)" opacity="0.55"/>
  <path d="M30.5 33 L36 33 L37.5 30 L32 30 Z" fill="url(#terraceDark)" opacity="0.55"/>
  <path d="M40 25 L46 25 L47.5 22 L42 22 Z" fill="url(#terraceDark)" opacity="0.55"/>

  <!-- پین موقعیت (نماد نقشه/GPS سامانه) روی بالاترین قله -->
  <g transform="translate(51.5 9.5)">
    <path d="M0 0 C4 0 6.5 2.6 6.5 6 C6.5 10 0 17 0 17 C0 17 -6.5 10 -6.5 6 C-6.5 2.6 -4 0 0 0 Z" fill="#F2B25C" stroke="#161D19" stroke-width="1"/>
