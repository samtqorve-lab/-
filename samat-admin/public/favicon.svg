<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242F29"/>
      <stop offset="1" stop-color="#161D19"/>
    </linearGradient>
    <linearGradient id="terrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0975A"/>
      <stop offset="1" stop-color="#B8642A"/>
