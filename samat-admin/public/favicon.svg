  <path d="M4 46 Q18 40 28 45 T60 41" stroke="#8FA096" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.25"/>

  <!-- معدن روباز پلکانی (نماد صنعت معدن) -->
