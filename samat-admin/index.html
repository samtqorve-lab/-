<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- این پنل فقط برای کارکنان اداره است و لاگین لازم دارد؛ عمداً از ایندکس گوگل کنار گذاشته شده
         (برخلاف /tech-officer/ که سامانه‌ی عمومی مسئولان فنی است و باید قابل‌جستجو باشد). -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- اتصال زودهنگام به Supabase، تا وقتی main.js اولین درخواست session را می‌زند،
         DNS/TLS این دامنه از قبل برقرار شده باشد (چند صد میلی‌ثانیه در اولین بار بارگذاری) -->
    <link rel="preconnect" href="https://khhurfxqxkuphksglgqi.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://khhurfxqxkuphksglgqi.supabase.co" />
    <!-- تم ایکس: روشن یا تاریک. پیش‌فرض از تنظیم سیستم، و با دکمه‌ی 🌙/☀️ بالای صفحه قابل تغییر دستی.
         قبل از رندر اعمال می‌شود تا چشمک‌زدن سفید نداشته باشیم. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        var t = localStorage.getItem('samat.theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* ignore */ }
    </script>
    <title>پنل ادمین صمت — اداره صنعت، معدن و تجارت قروه</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
