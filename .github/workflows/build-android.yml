name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'samat-tech/**'

permissions:
  contents: write   # لازم برای ساخت GitHub Release (منبع دانلود APK برای بنر «آپدیت موجود است»)

# این ورک‌فلو با build-tech-web.yml روی همان مسیر (samat-tech/**) هم‌زمان اجرا می‌شود و هر دو در
# انتها به main پوش می‌کنند — بدون این قفل، هر دو تقریباً هم‌زمان تمام می‌شدند و مرحله‌ی پوش
# یکی‌شان (بعد از چند تلاش rebase) شکست می‌خورد (دقیقاً همان چیزی که باعث می‌شد manifest آپدیت
# اندروید commit نشود). با یک گروه concurrency مشترک، اگر همزمان اجرا شوند، دومی صبر می‌کند تا
# اولی کامل تمام شود (نه این‌که لغو شود) — پس هیچ‌کدام مرحله‌ی پوش را از دست نمی‌دهند.
concurrency:
  group: samat-main-push-lock
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create .env file
        working-directory: samat-tech
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        working-directory: samat-tech
        run: npm install

      - name: Install TypeScript
        working-directory: samat-tech
        run: npm install -D typescript

      # APP_BUILD_NUMBER داخل خودِ جاوااسکریپت اپ (به‌عنوان __APP_BUILD__) جاسازی می‌شود تا
      # با versionCode داخل manifest.json (پایین همین فایل) مقایسه شود و تشخیص دهد آپدیت جدیدتری هست یا نه.
      - name: Build web assets and sync Capacitor
        working-directory: samat-tech
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run cap:sync

      - name: Grant execute permission to gradlew
        run: chmod +x samat-tech/android/gradlew

      # بدون این قدم، هر اجرای CI روی یه رانر تازه یه debug.keystore تصادفی جدید می‌ساخت — یعنی هر
      # build با یه امضای متفاوت منتشر می‌شد و اندروید موقع آپدیت می‌گفت «امضاها مطابقت ندارند»
      # (کاربر مجبور می‌شد اول نسخه‌ی قبلی رو پاک کنه). با این کلید ثابت (یک‌بار ساخته و به‌عنوان
      # Secret ذخیره شده)، همه‌ی نسخه‌ها همیشه با همون امضا منتشر می‌شن و آپدیت بدون حذف نصب می‌شود.
      - name: Restore persistent debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: samat-tech/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: samat-tech-debug-apk
          path: samat-tech/android/app/build/outputs/apk/debug/app-debug.apk

      # --- ساخت نسخه‌ی امضاشده‌ی release (برای انتشار در بازار/گوگل‌پلی، جدا از نسخه‌ی دیباگِ
      # داخلی بالا که فقط برای آپدیت خودکار سایدلود روی گوشی‌های مسئولین فنی استفاده می‌شود) ---
      - name: Restore release keystore
        working-directory: samat-tech/android
        run: |
          echo "${{ secrets.ANDROID_TECH_RELEASE_KEYSTORE_B64 }}" | base64 -d > samat-tech-release.keystore
          cat > release-keystore.properties <<EOF
          storeFile=samat-tech-release.keystore
          storePassword=${{ secrets.ANDROID_TECH_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_TECH_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_TECH_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: samat-tech/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: samat-tech-release-apk
          path: samat-tech/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release APK to a GitHub Release (برای آپلود دستی در بازار/گوگل‌پلی)
        id: release_signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="tech-release-${{ github.run_number }}"
          APK_NAME="samat-tech-release-${{ github.run_number }}.apk"
          cp samat-tech/android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          gh release create "$TAG" "$APK_NAME" \
            --repo samtqorve-lab/- \
            --title "اپ مسئول فنی/ایمنی (اندروید) — نسخه‌ی امضاشده برای بازار/گوگل‌پلی — build ${{ github.run_number }}" \
            --notes "این نسخه با کلید release واقعی امضا شده (نه کلید دیباگ داخلی) — برای آپلود در کافه‌بازار/گوگل‌پلی. commit ${{ github.sha }}"
          echo "url=https://github.com/samtqorve-lab/-/releases/download/$TAG/$APK_NAME" >> "$GITHUB_OUTPUT"

      # --- انتشار عمومی (نسخه‌ی دیباگ داخلی) + به‌روزرسانی manifest آپدیت خودکار ---
      - name: Publish APK to a GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="tech-android-${{ github.run_number }}"
          APK_NAME="samat-tech-${{ github.run_number }}.apk"
          cp samat-tech/android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          gh release create "$TAG" "$APK_NAME" \
            --repo samtqorve-lab/- \
            --title "اپ مسئول فنی/ایمنی (اندروید) — build ${{ github.run_number }}" \
            --notes "Build خودکار از commit ${{ github.sha }}"
          echo "url=https://github.com/samtqorve-lab/-/releases/download/$TAG/$APK_NAME" >> "$GITHUB_OUTPUT"

      # این manifest داخل سایت samat-admin میزبانی می‌شود (novinproduct.ir/updates/tech.json)
      # چون همان دامنه‌ای است که اپ مسئول فنی هم به آن دسترسی دارد.
      #
      # قبلاً این‌جا local git add/commit/push با retry+rebase انجام می‌شد — چون checkout این
      # jobا همزمان با jobهای دیگر (build-tech-web.yml) که هم به main پوش می‌کنند شروع می‌شود،
      # حالت local ممکن است چند ثانیه از HEAD واقعی عقب بماند و push حتی بعد از چند تلاش rebase
      # هم شکست بخورد (دقیقاً همان چیزی که چندبار باعث توقف این مرحله شد). حالا به‌جایش مستقیم از
      # GitHub Contents API استفاده می‌کنیم: هر تلاش، sha فعلی فایل را مستقیم از سرور (نه از
      # checkout محلی) می‌گیرد و فقط همان یک فایل را آپدیت می‌کند — کاملاً atomic و بدون وابستگی
      # به این‌که local checkout چقدر تازه است.
      - name: Update Android update-manifest (Contents API — بدون وابستگی به checkout محلی)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="samtqorve-lab/-"
          FILE_PATH="samat-admin/public/updates/tech.json"
          CONTENT=$(cat <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "build ${{ github.run_number }}",
            "url": "${{ steps.release.outputs.url }}",
            "notes": "به‌روزرسانی خودکار — commit ${{ github.sha }}"
          }
          EOF
          )
          B64=$(printf '%s' "$CONTENT" | base64 -w0)
          for i in 1 2 3 4 5; do
            SHA=$(gh api "repos/$REPO/contents/$FILE_PATH?ref=main" --jq .sha 2>/dev/null || true)
            ARGS=(-f message="chore: به‌روزرسانی خودکار manifest آپدیت اندروید مسئول فنی [skip ci]" -f content="$B64" -f branch=main)
            if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
            if gh api --method PUT "repos/$REPO/contents/$FILE_PATH" "${ARGS[@]}" > /dev/null; then
              echo "manifest به‌روزرسانی شد"
              exit 0
            fi
            echo "به‌روزرسانی رد شد (احتمالاً sha هم‌زمان تغییر کرده) — تلاش دوباره..."
            sleep 3
          done
          echo "به‌روزرسانی manifest نهایتاً شکست خورد" >&2
          exit 1
