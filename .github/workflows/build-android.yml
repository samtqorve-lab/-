name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'samat-tech/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create .env file
        working-directory: samat-tech
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        working-directory: samat-tech
        run: npm install

      - name: Install TypeScript
        working-directory: samat-tech
        run: npm install -D typescript

      - name: Build web assets and sync Capacitor
        working-directory: samat-tech
        run: npm run cap:sync

      - name: Grant execute permission to gradlew
        run: chmod +x samat-tech/android/gradlew

      - name: Build debug APK
        working-directory: samat-tech/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: samat-tech-debug-apk
          path: samat-tech/android/app/build/outputs/apk/debug/app-debug.apk
