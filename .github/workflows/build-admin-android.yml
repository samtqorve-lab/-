name: Build Admin Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'samat-admin/**'

permissions:
  contents: write   # لازم برای ساخت GitHub Release (منبع دانلود APK برای بنر «آپدیت موجود است»)

# همان قفل مشترک build-android.yml/build-tech-web.yml — این ورک‌فلو هم در انتها به main پوش
# می‌کند (manifest آپدیت اندروید پنل ادمین)؛ اگر یکی از آن دو هم‌زمان (مثلاً با dispatch دستی)
# در حال پوش باشد، این یکی صبر می‌کند تا نوبتش برسد، نه این‌که پوشش شکست بخورد.
concurrency:
  group: samat-main-push-lock
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create .env file
        working-directory: samat-admin
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        working-directory: samat-admin
        run: npm install

      # APP_BUILD_NUMBER داخل خودِ جاوااسکریپت اپ (به‌عنوان __APP_BUILD__) جاسازی می‌شود تا
      # با versionCode داخل manifest.json (پایین همین فایل) مقایسه شود و تشخیص دهد آپدیت جدیدتری هست یا نه.
      - name: Build web assets
        working-directory: samat-admin
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: samat-admin
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x samat-admin/android/gradlew

      # همان کیستور ثابتِ اپ مسئول فنی — تا آپدیت پنل ادمین هم بدون نیاز به حذف نسخه‌ی قبلی نصب شود.
      - name: Restore persistent debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: samat-admin/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: samat-admin-debug-apk
          path: samat-admin/android/app/build/outputs/apk/debug/app-debug.apk

      # --- ساخت نسخه‌ی امضاشده‌ی release (برای انتشار در بازار/گوگل‌پلی) ---
      - name: Restore release keystore
        working-directory: samat-admin/android
        run: |
          echo "${{ secrets.ANDROID_ADMIN_RELEASE_KEYSTORE_B64 }}" | base64 -d > samat-admin-release.keystore
          cat > release-keystore.properties <<EOF
          storeFile=samat-admin-release.keystore
          storePassword=${{ secrets.ANDROID_ADMIN_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_ADMIN_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_ADMIN_RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: samat-admin/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: samat-admin-release-apk
          path: samat-admin/android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release APK to a GitHub Release (برای آپلود دستی در بازار/گوگل‌پلی)
        id: release_signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="admin-release-${{ github.run_number }}"
          APK_NAME="samat-admin-release-${{ github.run_number }}.apk"
          cp samat-admin/android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          gh release create "$TAG" "$APK_NAME" \
            --repo samtqorve-lab/- \
            --title "پنل ادمین (اندروید) — نسخه‌ی امضاشده برای بازار/گوگل‌پلی — build ${{ github.run_number }}" \
            --notes "این نسخه با کلید release واقعی امضا شده (نه کلید دیباگ داخلی) — برای آپلود در کافه‌بازار/گوگل‌پلی. commit ${{ github.sha }}"
          echo "url=https://github.com/samtqorve-lab/-/releases/download/$TAG/$APK_NAME" >> "$GITHUB_OUTPUT"

      # --- انتشار عمومی + به‌روزرسانی manifest آپدیت خودکار ---
      - name: Publish APK to a GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="admin-android-${{ github.run_number }}"
          APK_NAME="samat-admin-${{ github.run_number }}.apk"
          cp samat-admin/android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          gh release create "$TAG" "$APK_NAME" \
            --repo samtqorve-lab/- \
            --title "پنل ادمین (اندروید) — build ${{ github.run_number }}" \
            --notes "Build خودکار از commit ${{ github.sha }}"
          echo "url=https://github.com/samtqorve-lab/-/releases/download/$TAG/$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Update Android update-manifest (Contents API — بدون وابستگی به checkout محلی)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="samtqorve-lab/-"
          FILE_PATH="samat-admin/public/updates/admin.json"
          CONTENT=$(cat <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "build ${{ github.run_number }}",
            "url": "${{ steps.release.outputs.url }}",
            "notes": "به‌روزرسانی خودکار — commit ${{ github.sha }}"
          }
          EOF
          )
          B64=$(printf '%s' "$CONTENT" | base64 -w0)
          for i in 1 2 3 4 5; do
            SHA=$(gh api "repos/$REPO/contents/$FILE_PATH?ref=main" --jq .sha 2>/dev/null || true)
            ARGS=(-f message="chore: به‌روزرسانی خودکار manifest آپدیت اندروید پنل ادمین [skip ci]" -f content="$B64" -f branch=main)
            if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
            if gh api --method PUT "repos/$REPO/contents/$FILE_PATH" "${ARGS[@]}" > /dev/null; then
              echo "manifest به‌روزرسانی شد"
              exit 0
            fi
            echo "به‌روزرسانی رد شد (احتمالاً sha هم‌زمان تغییر کرده) — تلاش دوباره..."
            sleep 3
          done
          echo "به‌روزرسانی manifest نهایتاً شکست خورد" >&2
          exit 1
