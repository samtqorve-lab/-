name: Build Admin Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'samat-admin/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create .env file
        working-directory: samat-admin
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Install web app dependencies
        working-directory: samat-admin
        run: npm install

      - name: Build web assets
        working-directory: samat-admin
        run: npm run build

      - name: Install Electron app dependencies
        working-directory: samat-admin/electron-app
        run: npm install

      - name: Build Windows installer
        working-directory: samat-admin/electron-app
        run: npm run build:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: samat-admin-desktop-windows
          path: samat-admin/electron-app/release/*.exe
