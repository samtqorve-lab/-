name: Build Admin Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'samat-admin/**'
      - '!samat-admin/public/updates/**'
      - '!samat-admin/public/tech-officer/**'

permissions:
  contents: write   # لازم برای ساخت GitHub Release (که آپدیت خودکار اپ از آن استفاده می‌کند)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create .env file
        working-directory: samat-admin
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Install web app dependencies
        working-directory: samat-admin
        run: npm install

      - name: Build web assets
        working-directory: samat-admin
        run: npm run build

      - name: Install Electron app dependencies
        working-directory: samat-admin/electron-app
        run: npm install

      # نسخه با شماره‌ی اجرای Actions تنظیم می‌شود (۱.۰.<run_number>) تا electron-updater
      # بتواند «جدیدتر از نسخه‌ی نصب‌شده‌ی فعلی» بودن هر build را تشخیص دهد.
      - name: Set version from run number
        working-directory: samat-admin/electron-app
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version

      # ساخت نصاب فقط لوکال انجام می‌شود (بدون publish)؛ انتشار جداگانه با gh CLI انجام می‌شود.
      # اگر ساخت شکست بخورد، ۲۵ خط آخر خروجی هم به‌صورت Annotation و هم در Summary اجرا نمایش داده می‌شود
      # (بدون نیاز به باز شدن صفحه‌ی لاگ کامل).
      - name: Build Windows installer
        working-directory: samat-admin/electron-app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set +e
          npm run prepare:web > build.log 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then
            npx electron-builder --win --publish never >> build.log 2>&1
            rc=$?
          fi
          echo "----- last 40 lines of build.log -----"
          tail -n 40 build.log
          if [ $rc -ne 0 ]; then
            MSG=$(tail -n 25 build.log | tr '\r\n' '  ' | sed 's/%/%25/g' | cut -c1-3500)
            echo "::error title=Build Windows installer failed::$MSG"
            {
              echo '### Build Windows installer failed'
              echo '```'
              tail -n 60 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: List build output
        working-directory: samat-admin/electron-app
        shell: bash
        run: ls -la release

      - name: Publish GitHub Release
        working-directory: samat-admin/electron-app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          REPO="${{ github.repository }}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --target "${{ github.sha }}" \
              --title "$TAG" --notes "SAMAT Admin Desktop (Windows) build $TAG"
          fi
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt"
            if gh release upload "$TAG" --repo "$REPO" --clobber \
                release/*.exe release/*.exe.blockmap release/latest.yml; then
              echo "Upload OK"
              exit 0
            fi
            sleep 15
          done
          echo "Upload failed after 3 attempts"
          exit 1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: samat-admin-desktop-windows
          path: samat-admin/electron-app/release/*.exe
